<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <title>ClipBox sin conexion</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: radial-gradient(circle at top, #1a1b26 0%, #0f1016 100%);
        --card: rgba(22, 24, 37, 0.86);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f3f4f6;
        --muted: #9ca3af;
        --primary: #6366f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .card {
        width: min(100%, 460px);
        padding: 2rem;
        border-radius: 22px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.16);
        color: #c7d2fe;
        font-size: 0.85rem;
        font-weight: 600;
      }

      h1 {
        margin: 1rem 0 0.75rem;
        font-size: clamp(1.8rem, 5vw, 2.3rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        margin-top: 1.5rem;
        color: white;
        text-decoration: none;
        font-weight: 600;
        background: linear-gradient(135deg, var(--primary), #4f46e5);
        padding: 0.8rem 1rem;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Sin conexion</div>
      <h1>ClipBox no puede cargar datos ahora mismo.</h1>
      <p>La aplicacion sigue instalada, pero necesitas volver a conectarte para sincronizar snippets y consultar contenido remoto.</p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
